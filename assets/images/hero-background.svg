<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#168BFF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="m"><rect width="1600" height="900" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1600" height="900" fill="url(#grid)" mask="url(#m)"/>
  <g stroke="#8052FF" stroke-opacity="0.35" stroke-width="1.2" fill="none">
    <polyline points="120,220 300,300 480,240 620,360"/>
    <polyline points="1000,160 1180,260 1340,200 1480,320"/>
    <polyline points="200,700 380,620 560,680 720,600"/>
    <polyline points="1060,700 1220,620 1400,700"/>
  </g>
  <g fill="#168BFF" fill-opacity="0.7">
    <circle cx="120" cy="220" r="4"/><circle cx="300" cy="300" r="4"/><circle cx="480" cy="240" r="4"/><circle cx="620" cy="360" r="4"/>
    <circle cx="1000" cy="160" r="4"/><circle cx="1180" cy="260" r="4"/><circle cx="1340" cy="200" r="4"/><circle cx="1480" cy="320" r="4"/>
    <circle cx="200" cy="700" r="4"/><circle cx="380" cy="620" r="4"/><circle cx="560" cy="680" r="4"/><circle cx="720" cy="600" r="4"/>
    <circle cx="1060" cy="700" r="4"/><circle cx="1220" cy="620" r="4"/><circle cx="1400" cy="700" r="4"/>
  </g>
</svg>
